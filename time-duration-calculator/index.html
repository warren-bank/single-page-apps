<!DOCTYPE html>
<html lang="en" class="no-js bg-fixed bg-gray-900 bg-gradient-to-br from-gray-900 via-gray-800 to-slate-900 text-white">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/time-duration-calculator_32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/time-duration-calculator_16x16.png">
    <title>Time Duration Calculator - Precise Date & Time Difference Tool</title>
    <meta name="description" content="A precise tool to calculate the time difference between two dates.">

    <script>
        !function(t,e){"use strict";t=t||"docReady",e=e||window;var n=[],a=!1,o=!1;function c(){if(!a){a=!0;for(var t=0;t<n.length;t++)n[t].fn.call(window,n[t].ctx);n=[]}}function d(){"complete"===document.readyState&&c()}e[t]=function(t,e){if("function"!=typeof t)throw TypeError("callback for docReady(fn) must be a function");if(a){setTimeout(function(){t(e)},1);return}n.push({fn:t,ctx:e}),"complete"!==document.readyState&&(document.attachEvent||"interactive"!==document.readyState)?o||(document.addEventListener?(document.addEventListener("DOMContentLoaded",c,!1),window.addEventListener("load",c,!1)):(document.attachEvent("onreadystatechange",d),window.attachEvent("onload",c)),o=!0):setTimeout(c,1)}}("docReady",window),function(t){let e=t.querySelector?t.querySelector("html"):t.body.parentNode||t.head.parentNode||t.children||t.all[0];e.classList.remove("no-js"),e.classList.add("js"),docReady(function(){setTimeout(function(){e.classList.add("js-loaded")},500)})}(document||window.document);
    </script>
    <style>
        html,body{position:relative;overscroll-behavior-y:contain;overscroll-behavior:contain;height:100%;touch-action:pan-x pan-y}#loading{display:none;background:#6366f1;position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999}#loading .ripple-loading,#loading .ripple-loading div{box-sizing:border-box}#loading .ripple-loading{position:relative;width:80px;height:80px;left:50%;top:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%)}#loading .ripple-loading div{position:absolute;border:4px solid #e8202e;opacity:1;border-radius:50%;-webkit-animation:1s cubic-bezier(0,.2,.8,1) infinite rippler;animation:1s cubic-bezier(0,.2,.8,1) infinite rippler}#loading .ripple-loading div:nth-child(2){-webkit-animation-delay:-.5s;animation-delay:-.5s;border-color:#ece717}@-webkit-keyframes rippler{0%,4.9%{top:36px;left:36px;width:8px;height:8px;opacity:0}5%{top:36px;left:36px;width:8px;height:8px;opacity:1}100%{top:0;left:0;width:80px;height:80px;opacity:0}}@keyframes rippler{0%,4.9%{top:36px;left:36px;width:8px;height:8px;opacity:0}5%{top:36px;left:36px;width:8px;height:8px;opacity:1}100%{top:0;left:0;width:80px;height:80px;opacity:0}}html.js #loading{display:block}html.js.js-loaded #app{display:-ms-flexbox;display:flex;-ms-flex-direction:column;flex-direction:column;}html.js #app,html.js.js-loaded #loading,html.no-js #app{display:none}
    </style>

    <!-- Stylesheet -->
    <link href="./app.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen">

    <!-- Loading -->
    <div id="loading">
        <div class="ripple-loading">
            <div></div>
            <div></div>
        </div>
    </div>

    <!-- App -->
    <div id="app" class="w-full max-w-2xl mx-auto bg-gray-800/50 backdrop-blur-sm rounded-2xl shadow-2xl p-6 md:p-8 space-y-8 p-4">

        <!-- Header -->
        <header id="header" class="header">
            <section class="container text-center">
                <h1 class="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-green-300 via-blue-400 to-purple-500"><span class="block md:inline text-center"> Age & Duration</span> <span class="block md:inline text-center">Calculator</span></h1>
                <p class="text-gray-400 mt-2">Calculate the precise duration between two moments in time.</p>
            </section>
        </header>

        <!-- Main -->
        <main id="main" class="main">
            <section class="container">
                <!-- Input Section -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- From Date -->
                    <div>
                        <label for="fromDate" class="block text-sm font-medium text-gray-300 mb-2 leading-[2]">From</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            </div>
                            <input type="datetime-local" id="fromDate" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5" required>
                        </div>
                    </div>
                    <!-- To Date -->
                    <div>
                        <div class="flex justify-between items-center mb-2 leading-[2]">
                            <label for="toDate" class="block text-sm font-medium text-gray-300 leading-[2]">To</label>
                            <div class="flex items-center space-x-2 leading-[2]">
                                <label for="useCurrentTime" class="whitespace-nowrap leading-[1]">
                                    <span class="text-xs text-gray-400 leading-[1]">Use Current Time</span>
                                </label>
                                <label class="switch leading-[1]">
                                    <input type="checkbox" id="useCurrentTime" class=" leading-[1]" checked>
                                    <span class="slider leading-[1]"></span>
                                </label>
                            </div>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            </div>
                            <input type="datetime-local" id="toDate" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5" disabled>
                        </div>
                    </div>
                </div>

                <!-- Results Section -->
                <div id="results" class="space-y-6 pt-4">
                    <!-- Main Result -->
                    <div id="mainResultContainer" class="text-center bg-gray-900/60 p-6 rounded-xl result-card hidden">
                        <h2 class="text-lg font-medium text-gray-400 mb-2">Total Duration</h2>
                        <div id="mainResult" class="flex flex-wrap items-baseline justify-center gap-x-4 gap-y-2">
                            <!-- Dynamic content here -->
                        </div>
                    </div>

                    <!-- Detailed Results -->
                    <div id="detailedResultsContainer" class="result-card hidden">
                        <h3 class="text-center text-lg font-medium text-gray-400 mb-4">Duration in other units</h3>
                        <div id="detailedResults" class="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-4 justify-center items-center content-center">
                            <!-- Dynamic content here -->
                        </div>
                    </div>
                </div>
            </section>
        </main>

    </div>

    <!-- main javascript -->
    <script src="./app.js"></script>
</body>
</html>
